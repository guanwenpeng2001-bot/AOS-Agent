name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing package version to publish"
        required: true
        default: "0.84.3"
      tag:
        description: "Existing Git tag containing that version"
        required: true
        default: "v0.84.3"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish public packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Use npm trusted-publishing client
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release package set
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node --input-type=module --eval 'import { getPublicWorkspacePackages } from "./scripts/release-packages.mjs"; const packages = getPublicWorkspacePackages(); const version = process.env.RELEASE_VERSION; if (packages.length !== 9) throw new Error(`Expected exactly 9 public packages, found ${packages.length}`); if (packages.some((pkg) => pkg.version !== version)) throw new Error(`Package versions do not all match ${version}`); console.log(`Publishing ${packages.length} packages at ${version}`);'

      - name: Build packages
        run: npm run build

      - name: Publish packages with npm OIDC
        run: node scripts/publish.mjs
